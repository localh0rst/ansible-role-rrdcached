---
- name: Install RRDCacheD packages
  ansible.builtin.apt:
    name: "{{ rrdcached_packages }}"
    state: present
    update_cache: yes
  when: ansible_facts['os_family'] == "Debian"

- name: Install configuration file
  ansible.builtin.template:
    src: etc/default/rrdcached.j2
    dest: /etc/default/rrdcached
    owner: root
    group: root
    mode: '0644'
  notify: Restart RRDCacheD
